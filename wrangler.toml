name = "kuou-app"
main = "src/worker.ts"
compatibility_date = "2026-04-01"

# The first deploy creates the DNS record and orders the certificate; the
# kuou.dev zone just has to be in the same Cloudflare account.
routes = [{ pattern = "app.kuou.dev", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve index.html for unknown paths, so a client-side route like /calendar does
# not 404 when the browser re-fetches it on reload.
not_found_handling = "single-page-application"
